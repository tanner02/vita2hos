name: Host regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch test dependencies
        run: git submodule update --init external/mlib external/vita-headers
      - name: Run I/O tests with sanitizers
        run: sh tests/host/run.sh
      - name: Check deployment backup and rollback behavior
        run: python3 -B tests/host/test_deploy_switch.py
      - name: Check unresolved import reports
        run: python3 -B tests/host/test_report_imports.py
      - name: Check title-specific launch package validation
        run: python3 -B tests/host/test_title_profile.py
      - name: Check title-profile FTP installation and rollback
        run: python3 -B tests/host/test_deploy_title_profile.py
      - name: Check optional hardware-probe packaging
        run: python3 -B tests/host/test_package_hardware_smoke.py

  shader-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned shader dependencies and fixtures
        run: |
          git submodule update --init external/Vita3K external/vita-headers
          git -C external/Vita3K submodule update --init external/glslang external/SPIRV-Cross
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libfmt-dev
      - name: Build real shader integration checks
        run: |
          cmake -S tests/shader_integration -B /tmp/vita2hos-shader-integration -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build /tmp/vita2hos-shader-integration --target shader_integration -j 4
      - name: Compare uniform layouts against SPIR-V reflection
        run: ctest --test-dir /tmp/vita2hos-shader-integration --output-on-failure

  surface-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify pinned Vita compiler
        run: |
          curl --fail --location --silent --show-error https://github.com/vitasdk/autobuilds/releases/download/sdk-vita_softfp-snapshot-20261123.969.1/vitasdk-x86_64-linux-gnu-2026-11-23_22-03-46.tar.bz2 -o /tmp/vitasdk.tar.bz2
          printf '%s  %s\n' 634c0db811d8fe88b5beb06c0a69f4c3f2fc2f102e3b0cd25d3166f4bea555b1 /tmp/vitasdk.tar.bz2 | sha256sum --check
          mkdir /tmp/vita-probe-sdk
          tar -xjf /tmp/vitasdk.tar.bz2 -C /tmp/vita-probe-sdk
      - name: Build freestanding guest and audit imports
        run: |
          cmake -S tests/hardware/surface_probe -B /tmp/surface-probe -G Ninja -DVITASDK=/tmp/vita-probe-sdk/vitasdk
          cmake --build /tmp/surface-probe
          python3 -B tests/hardware/surface_probe/verify-imports.py --sdk /tmp/vita-probe-sdk/vitasdk --build-dir /tmp/surface-probe
      - name: Upload hardware diagnostic guest
        uses: actions/upload-artifact@v4
        with:
          name: Surface_probe
          path: |
            /tmp/surface-probe/executable
            /tmp/surface-probe/surface_probe.elf
