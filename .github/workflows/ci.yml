name: CI

permissions:
  id-token: write
  contents: read
  packages: read

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      # GCC 14 image includes PIC runtime multilibs missing from newer images.
      image: ghcr.io/vita2hos/devcontainer/vita2hos@sha256:f124bf98c40aee0038ab72444382382e16bccb6c93160b22337285bb404ab21c
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch build dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 external/mlib external/dlmalloc external/vita-headers external/Vita3K
          git -C external/Vita3K submodule update --init --depth 1 external/glslang

      - name: Configure
        run: |
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-g++ -print-multi-lib
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-g++ -march=armv8-a+crc+crypto -fPIE -print-file-name=libg.a
          cmake --preset ${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}

      - name: Validate generated runtime metadata
        run: python3 -B tools/check-runtime-npdm.py build/${{ matrix.build_type }}/vita2hos.nsp

      # Diagnostic ELF only: relaxing this check identifies the remaining
      # read-only relocations. It is never uploaded as a runnable NSP.
      - name: Diagnose failed Debug link
        if: failure() && matrix.build_type == 'Debug'
        run: |
          cmake --preset Debug -DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,notext
          cmake --build --preset Debug --target vita2hos
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-readelf -lSW build/Debug/vita2hos.elf > build/Debug/link-layout.txt
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-readelf -rW build/Debug/vita2hos.elf > build/Debug/link-relocations.txt

      - name: Upload failed-link diagnostics
        if: failure() && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: Link_diagnostics_${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/Debug/link-layout.txt
            build/Debug/link-relocations.txt
            build/Debug/vita2hos.map
            build/Debug/compile_commands.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: |
            build/${{ matrix.build_type }}/vita2hos.elf
            build/${{ matrix.build_type }}/vita2hos.map
            build/${{ matrix.build_type }}/vita2hos.nsp
