name: CI

permissions:
  id-token: write
  contents: read
  packages: read

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vita2hos/devcontainer/vita2hos:latest
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset ${{ matrix.build_type }}

      - name: Build
        run: cmake --build --preset ${{ matrix.build_type }}

      # Diagnostic ELF only: relaxing this check identifies the remaining
      # read-only relocations. It is never uploaded as a runnable NSP.
      - name: Diagnose failed Debug link
        if: failure() && matrix.build_type == 'Debug'
        run: |
          cmake --preset Debug -DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,notext
          cmake --build --preset Debug --target vita2hos
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-readelf -lSW build/Debug/vita2hos.elf > build/Debug/link-layout.txt
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-readelf -rW build/Debug/vita2hos.elf > build/Debug/link-relocations.txt

      - name: Upload failed-link diagnostics
        if: failure() && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: Link_diagnostics_${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/Debug/link-layout.txt
            build/Debug/link-relocations.txt
            build/Debug/vita2hos.map
            build/Debug/compile_commands.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build_${{ matrix.build_type }}_${{ github.sha }}
          if-no-files-found: error
          path: |
            build/${{ matrix.build_type }}/vita2hos.elf
            build/${{ matrix.build_type }}/vita2hos.map
            build/${{ matrix.build_type }}/vita2hos.nsp
